services:
  - type: web
    name: ebay-marketplace-blog
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: ebay-marketplace-blog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_NAME
        value: Marketplace Finds
      - key: SITE_TAGLINE
        value: Useful product guides and smart shopping ideas
      - key: SITE_URL
        sync: false
      - key: SOURCE_SITE_URL
        value: https://ebaymarketplace.biz
      - key: SOURCE_SITEMAP_URL
        value: https://ebaymarketplace.biz/sitemap.xml
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_SEARCH_CONSOLE_PROPERTY
        sync: false
      - key: AUTO_PUBLISH
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: POSTS_PER_RUN
        value: "1"
      - key: AUTOMATION_HOUR_UTC
        value: "13"
      - key: PRODUCT_IMPORT_LIMIT
        value: "25"
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: ebay-marketplace-blog-db
    plan: free
    databaseName: marketplace_blog
    user: marketplace_blog
