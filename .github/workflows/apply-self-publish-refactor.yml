name: Apply self-publishing refactor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply one-time refactor
        run: python scripts/refactor_no_oauth.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and test
        env:
          SECRET_KEY: test-secret
          ADMIN_PASSWORD: test-password
          SCHEDULER_ENABLED: "false"
        run: |
          python -m compileall -q .
          pytest -q

      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Search Console OAuth and enable self-publishing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
