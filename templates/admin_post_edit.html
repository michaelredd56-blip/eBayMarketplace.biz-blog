{% extends "admin_base.html" %}
{% block title %}Edit Post | {{ site_name }}{% endblock %}
{% block admin_content %}<div class="admin-heading"><div><span class="eyebrow">{{ post.status }}</span><h1>Edit article</h1></div>{% if post.status == 'published' %}<a class="button secondary" href="{{ url_for('article', slug=post.slug) }}" target="_blank">View live</a>{% endif %}</div><form class="panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="wide">Title<input name="title" value="{{ post.title }}" required></label><label class="wide">Excerpt<textarea name="excerpt" rows="3" required>{{ post.excerpt }}</textarea></label><label>Meta title<input name="meta_title" maxlength="60" value="{{ post.meta_title }}"></label><label>Focus keyword<input name="focus_keyword" value="{{ post.focus_keyword or '' }}"></label><label class="wide">Meta description<textarea name="meta_description" rows="3" maxlength="160">{{ post.meta_description }}</textarea></label><label>Category<input name="category" value="{{ post.category }}"></label><label class="checkbox"><input type="checkbox" name="regenerate_slug" value="1"> Regenerate URL slug from the title</label><label class="wide">Article HTML<textarea class="code-editor" name="content_html" rows="28" required>{{ post.content_html }}</textarea></label><button class="button" type="submit">Save changes</button></form>{% endblock %}
