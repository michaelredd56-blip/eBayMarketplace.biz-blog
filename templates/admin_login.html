{% extends "base.html" %}
{% block title %}Admin Sign In | {{ site_name }}{% endblock %}
{% block content %}<section class="login-page"><form class="login-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_url or '' }}"><span class="eyebrow">Secure administration</span><h1>Sign in</h1><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button full" type="submit">Open control center</button></form></section>{% endblock %}
